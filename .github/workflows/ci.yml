name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The pipeline is stdlib-only: no install step.
      - run: python -m unittest discover -s tests -v
      - run: python app.py --input data/sample_flows.jsonl --logs-dir /tmp/nids-smoke > /dev/null

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nids-agent .
      # Smoke test: one batch from the bundled sample through the image.
      - run: docker run --rm --entrypoint python nids-agent app.py --input data/sample_flows.jsonl > /dev/null
